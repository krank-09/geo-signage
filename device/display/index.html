<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signage Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; cursor: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body.dev { cursor: default; }
  #stage { position: fixed; inset: 0; }
  #stage > * { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .6s ease; background: #000; }
  #stage > .show { opacity: 1; }
  #empty { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
    background: #0f172a; text-align: center; gap: 8px; }
  #empty h1 { font-size: 4vw; margin: 0; } #empty p { color: #94a3b8; font-size: 1.6vw; margin: 0; }
  .hud { position: fixed; z-index: 5; font-size: 14px; padding: 6px 12px; border-radius: 999px;
    background: rgba(15, 23, 42, .72); backdrop-filter: blur(6px); }
  #status { top: 14px; right: 14px; display: flex; gap: 8px; align-items: center; }
  #info { left: 14px; bottom: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .off .dot { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
  #emergency { display: none; position: fixed; z-index: 6; inset: 0; border: 10px solid #ef4444; pointer-events: none;
    animation: blink 1s infinite; }
  #emergency span { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: #ef4444;
    padding: 6px 18px; border-radius: 999px; font-weight: 700; letter-spacing: .1em; }
  @keyframes blink { 50% { border-color: transparent; } }
  /* live broadcasts */
  #banner, #ticker, #fullscreen { display: none; position: fixed; z-index: 6; color: #fff; font-weight: 700; }
  #banner { top: 14px; left: 50%; transform: translateX(-50%); max-width: 70vw; padding: 12px 28px; border-radius: 999px;
    font-size: 26px; text-align: center; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
  #ticker { left: 0; right: 0; bottom: 0; height: 64px; overflow: hidden; align-items: center; font-size: 30px; white-space: nowrap; }
  #ticker span { display: inline-block; padding-left: 100%; animation: scroll linear infinite; }
  #fullscreen { inset: 0; align-items: center; justify-content: center; text-align: center; padding: 6vw; font-size: 6vw; line-height: 1.15; }
  .sev-info { background: #4338ca; } .sev-warning { background: #b45309; } .sev-critical { background: #b91c1c; }
  body.has-ticker #info { bottom: 78px; }
  @keyframes scroll { to { transform: translateX(-100%); } }
  #status { z-index: 8; } #info { z-index: 8; }
  #dev { display: none; position: fixed; z-index: 9; top: 60px; right: 14px; width: 250px; padding: 12px; border-radius: 12px;
    background: rgba(15, 23, 42, .94); font-size: 13px; }
  #dev h4 { margin: 0 0 8px; } #dev button { margin: 3px 3px 3px 0; padding: 6px 10px; border: 0; border-radius: 6px;
    background: #334155; color: #fff; cursor: pointer; } #dev button:hover { background: #475569; }
  #dev .d { background: #b91c1c; } #dev .g { background: #15803d; } #dev small { color: #94a3b8; display: block; margin-top: 8px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="empty"><h1 id="e-id">Waiting for content</h1><p>No content is assigned to this display yet.</p></div>
<div id="banner"></div>
<div id="ticker"><span id="ticker-text"></span></div>
<div id="fullscreen"></div>
<div id="emergency"><span>EMERGENCY</span></div>
<div class="hud" id="status"><span class="dot"></span><span id="status-text">connecting</span></div>
<div class="hud" id="info"></div>
<div id="dev">
  <h4>Demo controls</h4>
  <button class="d" onclick="ctl({offline:true})">Cut network</button>
  <button class="g" onclick="ctl({offline:false})">Restore network</button>
  <div id="gps-controls">
  <div style="margin-top:8px">Jump GPS to:</div>
  <button onclick="ctl({goto:'chandigarh'})">Chandigarh</button><button onclick="ctl({goto:'delhi'})">Delhi</button>
  <button onclick="ctl({goto:'jaipur'})">Jaipur</button><button onclick="ctl({goto:'mumbai'})">Mumbai</button>
  <div style="margin-top:8px"><button onclick="ctl({moving:true})">Resume route</button><button onclick="ctl({moving:false})">Pause</button></div>
  </div>
  <small id="dev-pos"></small>
</div>
<script>
const stage = document.getElementById('stage');
let state = null, signature = '', idx = 0, timer = null, current = null, epoch = 0;

async function ctl(body) {
  await fetch('/api/control', { method: 'POST', headers: { 'X-Control-Token': (state && state.control_token) || '' }, body: JSON.stringify(body) }); poll();
}
document.addEventListener('keydown', e => {
  if (e.key === 'd' && state && state.demo_controls) { const d = document.getElementById('dev'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; document.body.classList.toggle('dev'); }
});

function impression(item, startedAt) {
  const dur = (Date.now() - startedAt) / 1000;
  if (dur < 0.5) return;
  fetch('/api/impression', { method: 'POST', body: JSON.stringify({ content_id: item.content_id, duration: dur, started_at: new Date(startedAt).toISOString() }) }).catch(() => {});
}

// Draw what is on screen into a small JPEG and hand it to the agent, which uploads it for the dashboard.
let capturing = false;
async function capture() {
  if (capturing || !state) return;
  capturing = true;
  try {
    const W = 640, H = 360, c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = state.items.length ? '#000' : '#0f172a'; g.fillRect(0, 0, W, H);
    const w = current && (current.videoWidth || current.naturalWidth), h = current && (current.videoHeight || current.naturalHeight);
    if (state.items.length && w && h) {
      const r = (state.config.fit === 'cover' ? Math.max : Math.min)(W / w, H / h);
      g.drawImage(current, (W - w * r) / 2, (H - h * r) / 2, w * r, h * r);
    } else {
      g.fillStyle = '#fff'; g.font = 'bold 26px system-ui'; g.textAlign = 'center';
      g.fillText(state.items.length ? 'Loading content' : state.device_id + ' - waiting for content', W / 2, H / 2);
    }
    if (state.emergency) { g.strokeStyle = '#ef4444'; g.lineWidth = 8; g.strokeRect(4, 4, W - 8, H - 8); }
    const b = (state.broadcasts || [])[0];
    if (b) {
      g.fillStyle = { info: '#4338ca', warning: '#b45309', critical: '#b91c1c' }[b.severity] || '#4338ca';
      g.fillRect(0, H - 40, W, 40);
      g.fillStyle = '#fff'; g.font = 'bold 20px system-ui'; g.textAlign = 'left'; g.fillText(b.message.slice(0, 48), 12, H - 14);
    }
    g.fillStyle = 'rgba(15,23,42,.75)'; g.fillRect(8, 8, 190, 24);
    g.fillStyle = '#fff'; g.font = '13px system-ui'; g.textAlign = 'left';
    g.fillText((state.online ? 'ONLINE' : 'OFFLINE (cached)') + '  ' + state.device_id, 16, 25);
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.6));
    if (blob) await fetch('/api/screenshot', { method: 'POST', headers: { 'X-Page-Token': state.page_token || '' }, body: blob });
  } catch (e) { /* a failed capture is simply retried on the next poll */ } finally { capturing = false; }
}

function clearPlayback() { clearTimeout(timer); timer = null; epoch++; }

function playNext(myEpoch) {
  if (myEpoch !== epoch || !state || !state.items.length) return;
  const items = state.items;
  idx = idx % items.length;
  const item = items[idx];
  const fit = state.config.fit === 'cover' ? 'cover' : 'contain';
  const startedAt = Date.now();
  let el;
  const advance = () => { if (myEpoch !== epoch) return; impression(item, startedAt); idx++; playNext(myEpoch); };
  if (item.type === 'video') {
    el = document.createElement('video');
    el.src = item.src; el.autoplay = true; el.muted = state.config.mute !== false; el.playsInline = true;
    el.onended = advance; el.onerror = () => { timer = setTimeout(advance, 1500); };
    if (items.length === 1) el.loop = true;
  } else {
    el = document.createElement('img');
    el.src = item.src; el.onerror = () => { timer = setTimeout(advance, 1500); };
    timer = setTimeout(advance, Math.max(item.duration, 1) * 1000);
  }
  el.style.objectFit = fit;
  stage.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  const old = current; current = el;
  if (old) { old.classList.remove('show'); setTimeout(() => old.remove(), 700); }
  if (item.type === 'video' && items.length === 1) el.play().catch(() => {});
}

let broadcastSig = '';
const SEV_RANK = { info: 0, warning: 1, critical: 2 };
function renderBroadcasts(list) {
  const sig = JSON.stringify(list);
  if (sig === broadcastSig) return;  // only touch the DOM when the set changes, so the ticker animation is not restarted
  broadcastSig = sig;
  const top = (arr) => arr.reduce((a, b) => (SEV_RANK[b.severity] >= SEV_RANK[a.severity] ? b : a), arr[0]);
  const by = (style) => list.filter((b) => b.style === style);
  const show = (el, sev) => { el.className = 'sev-' + sev; el.style.display = el.id === 'fullscreen' ? 'flex' : el.id === 'ticker' ? 'flex' : 'block'; };
  const banners = by('banner'), tickers = by('ticker'), fulls = by('fullscreen');
  const b = document.getElementById('banner'), t = document.getElementById('ticker'), f = document.getElementById('fullscreen');
  if (banners.length) { const x = top(banners); b.textContent = x.message; show(b, x.severity); } else b.style.display = 'none';
  if (fulls.length) { const x = top(fulls); f.textContent = x.message; show(f, x.severity); } else f.style.display = 'none';
  if (tickers.length) {
    const text = tickers.map((x) => x.message).join('      \u2022      ');
    const span = document.getElementById('ticker-text'); span.textContent = text;
    span.style.animationDuration = Math.max(12, text.length * 0.22) + 's';
    show(t, top(tickers).severity);
  } else t.style.display = 'none';
  document.body.classList.toggle('has-ticker', tickers.length > 0);
}

function render() {
  renderBroadcasts(state.broadcasts || []);
  const s = state;
  document.getElementById('empty').style.display = s.items.length ? 'none' : 'flex';
  document.getElementById('e-id').textContent = s.device_id + ' - waiting for content';
  document.getElementById('emergency').style.display = s.emergency ? 'block' : 'none';
  const st = document.getElementById('status');
  st.classList.toggle('off', !s.online);
  document.getElementById('status-text').textContent = s.online
    ? 'ONLINE' + (s.ws ? ' - live' : '') : 'OFFLINE - playing cached content';
  document.getElementById('info').textContent =
    `${s.device_id}  |  ${s.reason || (s.zone ? s.zone.name : 'no zone')}` + (s.pending_impressions ? `  |  ${s.pending_impressions} queued` : '');
  document.getElementById('dev-pos').textContent = s.position
    ? `GPS ${s.position[0].toFixed(4)}, ${s.position[1].toFixed(4)}${s.moving === null ? ' (fixed location)' : s.moving === false ? ' (paused)' : ''}` : 'No GPS fix';
  document.getElementById('gps-controls').style.display = s.moving === null ? 'none' : '';
}

async function poll() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    state = await r.json();
  } catch (e) { return; } // local agent hiccup: keep whatever is playing
  render();
  if (state.capture) capture();
  const sig = state.items.map(i => i.src).join(',') + '|' + state.config.fit + '|' + state.config.mute;
  if (sig !== signature) {
    signature = sig; idx = 0; clearPlayback();
    if (state.items.length) playNext(epoch);
    else if (current) { current.remove(); current = null; }
  } else if (!timer && !current && state.items.length) { playNext(epoch); }
}
poll(); setInterval(poll, 1000);
</script>
</body>
</html>
