server {
  listen 80;
  client_max_body_size 110m;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  # REST + WebSocket to the FastAPI backend (the /api prefix is stripped)
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  # Vite fingerprints everything in /assets, so it can be cached for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must always be revalidated so a new build is picked up
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
