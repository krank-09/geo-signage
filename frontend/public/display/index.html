<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signage Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/display/manifest.webmanifest">
<link rel="icon" href="/display/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; -webkit-user-select: none; user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage > * { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .6s ease; background: #000; }
  #stage > .show { opacity: 1; }
  #empty { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: #0f172a; text-align: center; gap: 8px; padding: 24px; }
  #empty h1 { font-size: 6vmin; margin: 0; } #empty p { color: #94a3b8; font-size: 3vmin; margin: 0; }
  .hud { position: fixed; z-index: 8; font-size: 13px; padding: 5px 11px; border-radius: 999px; background: rgba(15, 23, 42, .72); backdrop-filter: blur(6px); }
  #status { top: max(12px, env(safe-area-inset-top)); right: 12px; display: flex; gap: 8px; align-items: center; }
  #info { left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .off .dot { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
  #emergency { display: none; position: fixed; z-index: 6; inset: 0; border: 10px solid #ef4444; pointer-events: none; animation: blink 1s infinite; }
  #emergency span { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: #ef4444; padding: 6px 18px; border-radius: 999px; font-weight: 700; letter-spacing: .1em; }
  @keyframes blink { 50% { border-color: transparent; } }
  #banner, #ticker, #fullscreen { display: none; position: fixed; z-index: 6; color: #fff; font-weight: 700; }
  #banner { top: 14px; left: 50%; transform: translateX(-50%); max-width: 80vw; padding: 10px 22px; border-radius: 999px; font-size: 20px; text-align: center; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
  #ticker { left: 0; right: 0; bottom: 0; height: 52px; overflow: hidden; align-items: center; font-size: 24px; white-space: nowrap; }
  #ticker span { display: inline-block; padding-left: 100%; animation: scroll linear infinite; }
  #fullscreen { inset: 0; align-items: center; justify-content: center; text-align: center; padding: 6vw; font-size: 7vmin; line-height: 1.15; }
  .sev-info { background: #4338ca; } .sev-warning { background: #b45309; } .sev-critical { background: #b91c1c; }
  body.has-ticker #info { bottom: 66px; }
  @keyframes scroll { to { transform: translateX(-100%); } }
  #info { z-index: 8; }
  /* setup and menu */
  .sheet { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: #0b1020; padding: 20px; overflow: auto; }
  .card { width: 100%; max-width: 420px; }
  .card h1 { margin: 0 0 4px; font-size: 24px; } .card p { color: #94a3b8; font-size: 14px; margin: 0 0 16px; line-height: 1.4; }
  label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin: 12px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 12px; border: 1px solid #334155; background: #111a33; color: #fff; font-size: 16px; }
  button { padding: 13px 18px; border: 0; border-radius: 999px; background: #5b49eb; color: #fff; font-size: 16px; font-weight: 700; margin-top: 18px; width: 100%; }
  button.ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; margin-top: 10px; }
  #err { color: #fca5a5; font-size: 14px; margin-top: 12px; min-height: 18px; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  #gear { position: fixed; z-index: 9; top: max(12px, env(safe-area-inset-top)); left: 12px; width: 34px; height: 34px; border-radius: 50%; margin: 0; padding: 0; font-size: 16px;
    background: rgba(15, 23, 42, .55); opacity: .35; }
  #menu dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; margin: 0 0 8px; } #menu dt { color: #94a3b8; } #menu dd { margin: 0; word-break: break-word; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="empty"><h1 id="e-id">Waiting for content</h1><p>No content is assigned to this display yet.</p></div>
<div id="banner"></div>
<div id="ticker"><span id="ticker-text"></span></div>
<div id="fullscreen"></div>
<div id="emergency"><span>EMERGENCY</span></div>
<div class="hud" id="status"><span class="dot"></span><span id="status-text">connecting</span></div>
<div class="hud" id="info"></div>
<button id="gear" aria-label="Display menu">&#9881;</button>

<div class="sheet" id="setup">
  <form class="card" id="setup-form" autocomplete="off">
    <h1>Set up this display</h1>
    <p>Ask your administrator to add a display in the dashboard and give you its Device ID and registration token.</p>
    <label for="f-id">Device ID</label><input id="f-id" required autocapitalize="characters" placeholder="DEV-004">
    <label for="f-token">Registration token</label><input id="f-token" required autocapitalize="characters" placeholder="XXXX-XXXX-XXXX">
    <label for="f-loc">Location</label>
    <select id="f-loc"><option value="gps">Use this device's GPS</option><option value="chandigarh">Fixed: Chandigarh</option><option value="delhi">Fixed: Delhi</option>
      <option value="jaipur">Fixed: Jaipur</option><option value="mumbai">Fixed: Mumbai</option><option value="ahmedabad">Fixed: Ahmedabad</option></select>
    <button id="f-go" type="submit">Start display</button>
    <div id="err" role="alert"></div>
  </form>
</div>

<div class="sheet" id="menu">
  <div class="card">
    <h1>Display</h1>
    <dl id="menu-info"></dl>
    <button id="m-close" type="button">Back to display</button>
    <button id="m-full" class="ghost" type="button">Fullscreen</button>
    <button id="m-reset" class="ghost" type="button">Forget this display</button>
  </div>
</div>
<script type="module" src="/display/app.js"></script>
</body>
</html>
